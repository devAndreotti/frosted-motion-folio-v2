name: Deploy to Cloudflare (devandreotti.com)

# main -> production on devandreotti.com; pull requests -> a preview version
# (link in the job log). Builds and stops quietly until the repository has
# the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Umami (Settings > Secrets and variables > Actions > Variables); empty = no Umami
      VITE_UMAMI_SRC: ${{ vars.UMAMI_SRC }}
      VITE_UMAMI_ID: ${{ vars.UMAMI_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:vps
      - name: Deploy (main)
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4.148.0 deploy
      # Optional: a read-only GitHub token for the /api/gh proxy (Cloudflare's shared IPs run out of the
      # unauthenticated quota). Repository secret GH_READ_TOKEN -> Worker secret GITHUB_TOKEN.
      - name: Worker secret GITHUB_TOKEN (main)
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
        run: |
          if [ -n "$GH_READ_TOKEN" ]; then printf '%s' "$GH_READ_TOKEN" | npx --yes wrangler@4.148.0 secret put GITHUB_TOKEN; fi
      - name: Preview version (pull request)
        if: github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          if out=$(npx --yes wrangler@4.148.0 versions upload --message "PR #${{ github.event.number }}" 2>&1); then
            echo "$out"
          elif grep -q "does not yet exist" <<< "$out"; then
            echo "::notice::No production Worker yet: the first merge to main creates it, previews work after that."
          else
            echo "$out"; exit 1
          fi
      - name: No Cloudflare token yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Built; deploy skipped until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set."
