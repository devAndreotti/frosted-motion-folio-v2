name: Deploy to Cloudflare (devandreotti.com)

# main -> production on devandreotti.com; pull requests -> a preview version
# (link in the job log). Builds and stops quietly until the repository has
# the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Umami (Settings > Secrets and variables > Actions > Variables); empty = no Umami
      VITE_UMAMI_SRC: ${{ vars.UMAMI_SRC }}
      VITE_UMAMI_ID: ${{ vars.UMAMI_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:vps
      - name: Deploy (main)
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4.148.0 deploy
      - name: Preview version (pull request)
        if: github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@4.148.0 versions upload --message "PR #${{ github.event.number }}"
      - name: No Cloudflare token yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Built; deploy skipped until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set."
